.table{
 height:100%;width:min(100%,1250px);min-height:0;
 border:clamp(9px,1.7vw,18px) solid #342315;

   radial-gradient(ellipse at 48% 32%,#1d7353 0%,#14543f 43%,#0b382b 78%,#06251c 100%);

@media(orientation:portrait){
 .app{padding:5px 7px max(7px,env(safe-area-inset-bottom));gap:5px}

 .seat .stack{font-size:clamp(9px,2.5vw,12px)}
 .seat .state{font-size:8px}
 /* User is anchored at bottom inside the felt; controls remain in a separate row below the table. */
 .s0{top:6%;left:50%;transform:translateX(-50%)}

}

<body><div class="app">
<header class="top"><div class="brand">♠ POKEREZA <span>POKER</span></div><div id="handStatus">ДЕМО · 6 МЕСТ</div><div>Блайнды 10 / 20</div></header>
<main class="tablewrap"><section class="table"><div class="wm">POKEREZA</div><div class="pot"><small id="street">ПРЕФЛОП</small>Банк: <span id="pot">0</span></div><div class="community" id="community"></div><div class="hole" id="hole"></div><div class="notice" id="notice"></div><div id="seats"></div></section></main>
<section class="actions"><button class="act fold" id="fold">Фолд</button><button class="act call" id="checkCall">Чек</button><button class="act raise" id="raise">Ставка</button><button class="act allin" id="allin">All-in</button><div class="betbox">Размер <input id="betRange" type="range" min="20" max="500" step="10" value="60"><b id="betValue">60</b></div></section>
<footer class="bottom"><span id="message">Против пяти ИИ · виртуальные фишки</span><span><button id="newHand">Новая раздача</button> · <button id="reset">Сбросить стек</button></span></footer></div>
<script>
(()=>{'use strict';
const ranks='23456789TJQKA',suits=[['♠',0],['♥',1],['♦',1],['♣',0]];
const bots=[['Стратег','♜','balanced'],['Агрессор','♛','aggressive'],['Тайтовый','♞','tight'],['Коллирующий','♟','calling'],['Осторожный','♚','careful']];
const $=id=>document.getElementById(id);let players=[],deck=[],board=[],pot=0,currentBet=0,street=0,actor=0,handNo=0,over=false,busy=false,dealer=5,user=5,bb=20,sb=10,log=[];
const streetNames=['ПРЕФЛОП','ФЛОП','ТЁРН','РИВЕР','ШОУДАУН'];
function shuffle(){deck=[];for(let r of ranks)for(let [s,red] of suits)deck.push({r,s,red});for(let i=51;i>0;i--){let j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}}
function card(c,back=false){if(back)return '<div class="card back"></div>';let r=c.r==='T'?'10':c.r;return `<div class="card ${c.red?'red':''}"><span class="rank">${r}</span><span class="center">${c.s}</span></div>`}
function fmt(n){return Math.max(0,Math.round(n)).toLocaleString('ru-RU')}
function live(){return players.filter(p=>!p.folded)}
function active(){return players.filter(p=>!p.folded&&!p.allin&&p.stack>0)}
function next(from){for(let k=1;k<=6;k++){let i=(from+k)%6;if(!players[i].folded&&!players[i].allin&&players[i].stack>0)return i}return -1}
function logit(s){log.unshift(s);log=log.slice(0,3);$('message').textContent=s}
function render(){ $('pot').textContent=fmt(pot);$('street').textContent=streetNames[Math.min(street,4)];$('handStatus').textContent=`РАЗДАЧА #${handNo} · ${over?'ЗАВЕРШЕНА':'В ИГРЕ'}`;$('community').innerHTML=board.map((c,i)=>card(c)).join('');$('hole').innerHTML=players[user].hole.map(c=>card(c)).join('');$('seats').innerHTML=players.map((p,i)=>`<div class="seat s${i} ${i===actor&&!over?'active':''} ${p.folded?'folded':''} ${i===user?'user':''}"><div class="avatar">${p.icon}</div><div><div class="name">${p.name}${i===user?' · Вы':''}</div><div class="stack">${fmt(p.stack)} фишек</div><div class="state">${p.folded?'Фолд':p.allin?'All-in':i===actor&&!over?(busy&&i!==user?'<span class="thinking">Думает…</span>':'Ход'):p.action||'В игре'}</div></div><div class="mini-holes" aria-hidden="true"><i></i><i></i></div></div>`).join('');$('betValue').textContent=$('betRange').value;$('fold').disabled=over||busy||actor!==user;$('checkCall').disabled=over||busy||actor!==user;$('raise').disabled=over||busy||actor!==user;$('allin').disabled=over||busy||actor!==user;$('checkCall').textContent=currentBet>players[user].bet?'Колл '+fmt(currentBet-players[user].bet):'Чек';$('raise').textContent=currentBet>players[user].bet?'Рейз':'Ставка'}
function post(i,n){let p=players[i],v=Math.min(n,p.stack);p.stack-=v;p.bet+=v;p.total+=v;pot+=v;if(!p.stack)p.allin=true}
function newHand(){$('betRange').value=60;$('betValue').textContent='60';if(players[user]&&players[user].stack<=0){logit('Стек пуст — нажми «Сбросить стек»');return}handNo++;shuffle();board=[];pot=0;currentBet=0;street=0;over=false;busy=false;log=[];players.forEach(p=>{p.hole=[deck.pop(),deck.pop()];p.folded=p.stack<=0;p.allin=false;p.bet=0;p.total=0;p.action='';});dealer=(dealer+1)%6;post((dealer+1)%6,sb);post((dealer+2)%6,bb);currentBet=bb;actor=next((dealer+2)%6);$('notice').classList.remove('show');logit('Новая раздача');render();if(actor!==user)aiLoop()}
function strength(p){let all=[...p.hole,...board],v=all.map(c=>ranks.indexOf(c.r)+2),counts={};v.forEach(x=>counts[x]=(counts[x]||0)+1);let c=Object.values(counts).sort((a,b)=>b-a),suitCount={};all.forEach(x=>suitCount[x.s]=(suitCount[x.s]||0)+1);let flush=Object.values(suitCount).some(x=>x>=5),u=[...new Set(v)].sort((a,b)=>b-a);if(u.includes(14))u.push(1);let straight=false;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4)straight=true;if(flush&&straight)return 8;if(c[0]===4)return 7;if(c[0]===3&&c[1]>=2)return 6;if(flush)return 5;if(straight)return 4;if(c[0]===3)return 3;if(c[0]===2&&c[1]===2)return 2;if(c[0]===2)return 1;let a=ranks.indexOf(p.hole[0].r),b=ranks.indexOf(p.hole[1].r);return (Math.max(a,b)>=10?.7:0)+(Math.abs(a-b)<=1?.3:0)+(p.hole[0].s===p.hole[1].s?.25:0)+(a===b?.7:0)}
function decide(p,i,call){let st=strength(p)+Math.random()*.35,style=p.style;if(style==='tight'&&st<1.3&&call>bb*2)return {t:'fold'};if(style==='careful'&&st<1.6&&call>bb*2)return {t:'fold'};if(style==='calling'&&Math.random()<.72)return {t:call?'call':'check'};if(style==='aggressive'&&st>.8&&Math.random()<.55)return {t:'raise',amt:Math.min(p.stack,Math.max(bb*2,currentBet+bb*2))};if(st>2.4&&Math.random()<.55)return {t:'raise',amt:Math.min(p.stack,Math.max(bb*2,currentBet+bb*2))};if(!call)return {t:'check'};if(st>.8&&Math.random()<.6)return {t:'call'};return {t:'fold'}}
function act(i,a){let p=players[i],call=Math.max(0,currentBet-p.bet),stackBefore=p.stack;if(a.t==='fold'){p.folded=true;p.action='Фолд';logit(p.name+': фолд')}else if(a.t==='check'&&!call){p.action='Чек';logit(p.name+': чек')}else if(a.t==='call'){let v=Math.min(call,p.stack);p.stack-=v;p.bet+=v;p.total+=v;pot+=v;p.action=p.stack===0?'All-in':'Колл';if(!p.stack)p.allin=true;logit(p.name+': '+p.action)}else if(a.t==='raise'||a.t==='bet'){let target=Math.max(currentBet+bb,a.amt||bb*2),v=Math.min(Math.max(0,target-p.bet),p.stack);if(v){p.stack-=v;p.bet+=v;p.total+=v;pot+=v;currentBet=Math.max(currentBet,p.bet);p.action=a.t==='bet'?'Ставка':'Рейз';if(!p.stack)p.allin=true;logit(p.name+': '+p.action)}}else if(a.t==='allin'){let v=p.stack;p.stack=0;p.bet+=v;p.total+=v;pot+=v;p.allin=true;currentBet=Math.max(currentBet,p.bet);p.action='All-in';logit(p.name+': All-in')}if(p.stack<stackBefore)chipAnimation(i,stackBefore-p.stack)}
function roundDone(){
 const contenders=players.filter(p=>!p.folded&&!p.allin&&p.stack>0);
 if(live().length<=1)return true;
 if(contenders.length===0)return true;
 return contenders.every(p=>p.bet===currentBet);
}
function resetBets(){players.forEach(p=>p.bet=0);currentBet=0}
function chipAnimation(playerIndex,amount){
 const table=document.querySelector('.table'),seat=document.querySelector('.s'+playerIndex),potEl=document.querySelector('.pot');
 if(!table||!seat||!potEl)return;
 const tr=table.getBoundingClientRect(),sr=seat.getBoundingClientRect(),pr=potEl.getBoundingClientRect();
 const sx=sr.left+sr.width/2-tr.left,sy=sr.top+sr.height/2-tr.top;
 const ex=pr.left+pr.width/2-tr.left,ey=pr.top+pr.height/2-tr.top;
 const chip=document.createElement('i');chip.className='chip-fly';chip.style.left=sx+'px';chip.style.top=sy+'px';
 chip.style.setProperty('--dx',(ex-sx)+'px');chip.style.setProperty('--dy',(ey-sy)+'px');chip.setAttribute('aria-label',(players[playerIndex]?.name||'Игрок')+' ставит '+fmt(amount));
 table.appendChild(chip);setTimeout(()=>chip.remove(),520);
}
function revealCards(count,nextStreet){let n=0;const reveal=()=>{if(n<count){board.push(deck.pop());n++;render();setTimeout(reveal,170)}else{street=nextStreet;resetBets();actor=next(dealer);if(actor<0||active().length<=1){while(board.length<5)board.push(deck.pop());street=4;finish();return}logit('Открыты общие карты');render();if(actor!==user)aiLoop()}};reveal()}
function advance(){if(live().length<=1){finish();return}if(street===0){revealCards(3,1)}else if(street===1){revealCards(1,2)}else if(street===2){revealCards(1,3)}else{finish()}}
function aiLoop(){if(over||busy)return;busy=true;render();setTimeout(()=>{if(over){busy=false;return}if(actor===user){busy=false;render();return}let p=players[actor];if(!p||p.folded||p.allin){actor=next(actor);busy=false;if(actor<0)advance();else aiLoop();return}act(actor,decide(p,actor,Math.max(0,currentBet-p.bet)));if(live().length<=1){busy=false;finish();return}if(roundDone()){busy=false;advance();return}actor=next(actor);busy=false;if(actor<0)advance();else{render();aiLoop()}},650+Math.random()*850)}
function val(c){return ranks.indexOf(c.r)+2}
function score5(cs){let vs=cs.map(val).sort((a,b)=>b-a),cnt={};vs.forEach(v=>cnt[v]=(cnt[v]||0)+1);let g=Object.entries(cnt).map(([v,n])=>({v:+v,n})).sort((a,b)=>b.n-a.n||b.v-a.v),flush=cs.every(c=>c.s===cs[0].s),u=[...new Set(vs)].sort((a,b)=>b-a);if(u.includes(14))u.push(1);let st=0;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4)st=Math.max(st,u[i]);if(flush&&st)return [8,st];if(g[0].n===4)return [7,g[0].v,...g.filter(x=>x.n===1).map(x=>x.v)];if(g[0].n===3&&g[1]?.n===2)return [6,g[0].v,g[1].v];if(flush)return [5,...vs];if(st)return [4,st];if(g[0].n===3)return [3,g[0].v,...g.filter(x=>x.n===1).map(x=>x.v).sort((a,b)=>b-a)];let pairs=g.filter(x=>x.n===2).map(x=>x.v).sort((a,b)=>b-a);if(pairs.length>=2)return [2,pairs[0],pairs[1],g.find(x=>x.n===1)?.v||0];if(pairs.length===1)return [1,pairs[0],...g.filter(x=>x.n===1).map(x=>x.v).sort((a,b)=>b-a)];return [0,...vs]}
function score(cards){let best=[-1];function comb(start,a){if(a.length===5){let s=score5(a);for(let i=0;i<Math.max(s.length,best.length);i++){let x=s[i]||0,y=best[i]||0;if(x>y){best=s;break}if(x<y)break}return}for(let i=start;i<cards.length;i++)comb(i+1,[...a,cards[i]])}comb(0,[]);return best}
function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){let x=a[i]||0,y=b[i]||0;if(x!==y)return x-y}return 0}
function finish(){if(over)return;over=true;busy=false;let surv=live(),winners=[];if(surv.length===1)winners=surv;else{street=4;let ranked=surv.map(p=>({p,s:score([...p.hole,...board])})).sort((a,b)=>cmp(b.s,a.s));winners=ranked.filter(x=>cmp(x.s,ranked[0].s)===0).map(x=>x.p)}let each=Math.floor(pot/winners.length),rem=pot%winners.length;winners.forEach((p,i)=>p.stack+=each+(i===0?rem:0));let userWon=winners.includes(players[user]);let cats=['старшая карта','пара','две пары','тройка','стрит','флеш','фулл-хаус','каре','стрит-флеш'];let cat=surv.length>1?cats[score([...winners[0].hole,...board])[0]]:'';$('notice').innerHTML=`<strong>${userWon?'Вы выиграли!':'Победитель: '+winners.map(p=>p.name).join(', ')}</strong>${cat}<div>Банк ${fmt(pot)} фишек</div><div style="margin-top:6px;font-size:10px;color:#d8cda9">Вскрытие карт</div><div class="showcards">${surv.map(p=>`<div><b>${p.name}</b><div style="display:flex;gap:3px;justify-content:center;margin-top:4px">${p.hole.map(c=>card(c)).join('')}</div></div>`).join('')}</div><button id="nextHand">Следующая раздача</button>`;$('notice').classList.add('show');$('nextHand').onclick=newHand;$('message').textContent=userWon?'Победа!':`Победитель: ${winners.map(p=>p.name).join(', ')}`;render()}
function userAct(t){if(over||busy||actor!==user)return;let p=players[user],call=Math.max(0,currentBet-p.bet),a;if(t==='fold')a={t:'fold'};if(t==='call')a=call?{t:'call'}:{t:'check'};if(t==='raise'){let amount=Number($('betRange').value);a={t:call?'raise':'bet',amt:call?Math.max(currentBet+bb,amount):amount}}if(t==='allin')a={t:'allin'};act(user,a);if(live().length<=1){finish();return}if(roundDone()){advance();return}actor=next(user);if(actor<0){advance();return}render();aiLoop()}
function start(){players=[...bots.map(x=>({name:x[0],icon:x[1],style:x[2],stack:1000})),{name:'Вы',icon:'♠',style:'user',stack:1000}];$('fold').onclick=()=>userAct('fold');$('checkCall').onclick=()=>userAct('call');$('raise').onclick=()=>userAct('raise');$('allin').onclick=()=>userAct('allin');$('betRange').oninput=()=>$('betValue').textContent=$('betRange').value;$('newHand').onclick=()=>over?newHand():logit('Завершите текущую раздачу');$('reset').onclick=()=>{players.forEach(p=>p.stack=1000);newHand()};newHand()}
start();
})();
