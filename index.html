<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101315"><title>Pokereza Poker — Demo</title>
<style>
:root{--bg:#101315;--felt:#14543f;--gold:#c5a15b;--cream:#f0ebdd}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse,#202725,#101315 72%);font-family:system-ui,-apple-system,Arial;color:var(--cream)}button{font:inherit;cursor:pointer;border:0}button:disabled{opacity:.4}.app{height:100dvh;padding:7px 10px;display:flex;flex-direction:column;gap:5px}.top{height:25px;display:flex;justify-content:space-between;align-items:center;font-size:clamp(10px,1.4vw,14px);color:#e8ce8c}.brand{font-weight:900;letter-spacing:.12em}.brand span{color:#fff}.tablewrap{flex:1;min-height:0;display:grid;place-items:center}.table{position:relative;width:min(100%,1250px);height:100%;border-radius:48%/44%;background:radial-gradient(ellipse at 50% 40%,#1a674b,#0b382b 76%);border:clamp(7px,1.2vw,14px) solid #38291b;box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 0 7px #101315,0 10px 30px #0009}.table:after{content:"";position:absolute;inset:3%;border:1px solid #d6b76a44;border-radius:48%/44%;pointer-events:none}.wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(15px,3vw,30px);font-weight:900;letter-spacing:.2em;color:#fff0c}.pot{position:absolute;top:22%;left:50%;transform:translateX(-50%);z-index:2;text-align:center;font-size:clamp(11px,1.4vw,15px);font-weight:800;white-space:nowrap}.pot small{display:block;color:#c6d5c8;font-size:.8em;margin-bottom:3px}.community{position:absolute;top:35%;left:50%;transform:translateX(-50%);display:flex;gap:clamp(4px,.7vw,9px);z-index:3}.card{width:clamp(46px,6.5vw,86px);height:clamp(68px,10vw,122px);background:linear-gradient(145deg,#fffefa,#e5e0d5);color:#171717;border:1px solid #d8d0c1;border-radius:7px;box-shadow:0 5px 12px #0008;display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;font-weight:900;flex-shrink:0}.card.red{color:#bf2635}.rank{font-size:clamp(16px,2.5vw,27px);line-height:1}.suit{font-size:clamp(15px,2.2vw,24px);line-height:1}.center{align-self:center;font-size:clamp(20px,3vw,33px)}.back{background:repeating-linear-gradient(45deg,#79212a,#79212a 4px,#a33a40 4px,#a33a40 8px);border:2px solid #e4c98d;position:relative}.back:after{content:"♠";position:absolute;inset:5px;border:1px solid #e4c98d;border-radius:3px;display:grid;place-items:center;color:#e4c98d;font-size:24px}.hole{position:absolute;top:67%;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:4}.hole .card{width:clamp(50px,7.2vw,94px);height:clamp(74px,10.8vw,132px)}.hole .card:first-child{transform:rotate(-4deg)}.hole .card:last-child{transform:rotate(4deg) translateY(-4px)}.seat{position:absolute;z-index:4;display:flex;align-items:center;gap:5px;min-width:90px;padding:5px 7px;border:1px solid #c5a15b88;border-radius:11px;background:#101513ee;box-shadow:0 4px 12px #0006}.avatar{width:clamp(25px,3.7vw,39px);height:clamp(25px,3.7vw,39px);border:2px solid var(--gold);border-radius:50%;background:linear-gradient(135deg,#d4b36d,#5c4727);color:#17140e;display:grid;place-items:center;font-weight:900}.name{font-size:clamp(9px,1.15vw,13px);font-weight:800;white-space:nowrap}.stack{font-size:clamp(10px,1.25vw,14px);color:#f0d08a}.state{font-size:9px;color:#b9c4ba}.seat.active{border-color:#f3d17c;box-shadow:0 0 0 2px #c5a15b44,0 0 18px #e4c16a44}.seat.folded{opacity:.35}.user{border-color:#f0d08a}.s0{top:-2%;left:50%;transform:translateX(-50%)}.s1{top:12%;right:3%}.s2{bottom:16%;right:2%}.s3{bottom:-2%;left:50%;transform:translateX(-50%)}.s4{bottom:16%;left:2%}.s5{top:12%;left:3%}.actions{display:flex;align-items:center;justify-content:center;gap:clamp(4px,.8vw,10px);min-height:48px}.act{min-width:clamp(62px,10vw,120px);padding:clamp(8px,1.4vh,13px) 9px;border-radius:10px;font-weight:900;font-size:clamp(11px,1.5vw,16px);color:white}.fold{background:linear-gradient(#d4484d,#922029)}.call{background:linear-gradient(#239c6b,#126342)}.raise{background:linear-gradient(#f0d08a,#b98a3a);color:#1b170d}.allin{background:linear-gradient(#525b67,#242b32)}.betbox{display:flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid #c5a15b66;border-radius:9px;background:#111614;font-size:11px}.betbox input{width:clamp(65px,11vw,130px);accent-color:var(--gold)}.notice{display:none;position:absolute;z-index:8;left:50%;top:57%;transform:translate(-50%,-50%);background:#101513f2;border:1px solid var(--gold);border-radius:12px;padding:12px 16px;text-align:center;box-shadow:0 8px 25px #0009;min-width:200px}.notice.show{display:block}.notice strong{display:block;color:#f0d08a;font-size:18px}.notice button{margin-top:8px;background:linear-gradient(#f0d08a,#b98a3a);padding:7px 12px;border-radius:8px;font-weight:900}.bottom{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px;color:#b8beb8;padding:0 5px 2px}.bottom button{background:none;color:#f0d08a;text-decoration:underline;font-size:10px}
@media(orientation:portrait){.app{padding:5px;gap:4px}.table{border-radius:34%/23%}.seat{min-width:78px;padding:4px;gap:3px}.avatar{width:23px;height:23px}.name{font-size:8px}.stack{font-size:9px}.community{top:38%;gap:3px}.community .card{width:clamp(33px,9.5vw,47px);height:clamp(49px,14vw,66px);padding:3px}.community .rank{font-size:15px}.community .suit{font-size:14px}.community .center{font-size:18px}.hole{top:66%}.hole .card{width:clamp(38px,11vw,55px);height:clamp(56px,16vw,78px)}.s1,.s5{top:17%}.s2,.s4{bottom:21%}.actions{flex-wrap:wrap;min-height:82px;gap:4px}.act{flex:1;min-width:0;padding:10px 3px}.betbox{order:5;width:100%;justify-content:center}.betbox input{width:55vw}.pot{top:27%}}
@media(max-height:420px) and (orientation:landscape){.app{padding:3px 8px;gap:2px}.top{height:19px}.actions{min-height:37px}.act{padding:6px}.card{height:clamp(48px,15vh,76px);width:clamp(36px,5.2vw,60px)}.hole .card{height:clamp(52px,16vh,82px);width:clamp(39px,5.4vw,64px)}.seat{padding:3px 5px}.avatar{width:24px;height:24px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand">♠ POKEREZA <span>POKER</span></div><div id="handStatus">ДЕМО · 6 МЕСТ</div><div>Блайнды 10 / 20</div></header>
<main class="tablewrap"><section class="table"><div class="wm">POKEREZA</div><div class="pot"><small id="street">ПРЕФЛОП</small>Банк: <span id="pot">0</span></div><div class="community" id="community"></div><div class="hole" id="hole"></div><div class="notice" id="notice"></div><div id="seats"></div></section></main>
<section class="actions"><button class="act fold" id="fold">Фолд</button><button class="act call" id="checkCall">Чек</button><button class="act raise" id="raise">Ставка</button><button class="act allin" id="allin">All-in</button><div class="betbox">Размер <input id="betRange" type="range" min="20" max="500" step="10" value="60"><b id="betValue">60</b></div></section>
<footer class="bottom"><span id="message">Против пяти ИИ · виртуальные фишки</span><span><button id="newHand">Новая раздача</button> · <button id="reset">Сбросить стек</button></span></footer></div>
<script>
(()=>{'use strict';
const ranks='23456789TJQKA',suits=[['♠',0],['♥',1],['♦',1],['♣',0]];
const bots=[['Стратег','♜','balanced'],['Агрессор','♛','aggressive'],['Тайтовый','♞','tight'],['Коллирующий','♟','calling'],['Осторожный','♚','careful']];
const $=id=>document.getElementById(id);let players=[],deck=[],board=[],pot=0,currentBet=0,street=0,actor=0,handNo=0,over=false,busy=false,dealer=5,user=5,bb=20,sb=10,log=[];
const streetNames=['ПРЕФЛОП','ФЛОП','ТЁРН','РИВЕР','ШОУДАУН'];
function shuffle(){deck=[];for(let r of ranks)for(let [s,red] of suits)deck.push({r,s,red});for(let i=51;i>0;i--){let j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}}
function card(c,back=false){if(back)return '<div class="card back"></div>';let r=c.r==='T'?'10':c.r;return `<div class="card ${c.red?'red':''}"><span class="rank">${r}</span><span class="center">${c.s}</span><span class="suit" style="align-self:flex-end">${c.s}</span></div>`}
function fmt(n){return Math.max(0,Math.round(n)).toLocaleString('ru-RU')}
function live(){return players.filter(p=>!p.folded)}
function active(){return players.filter(p=>!p.folded&&!p.allin&&p.stack>0)}
function next(from){for(let k=1;k<=6;k++){let i=(from+k)%6;if(!players[i].folded&&!players[i].allin&&players[i].stack>0)return i}return -1}
function logit(s){log.unshift(s);log=log.slice(0,3);$('message').textContent=s}
function render(){ $('pot').textContent=fmt(pot);$('street').textContent=streetNames[Math.min(street,4)];$('handStatus').textContent=`РАЗДАЧА #${handNo} · ${over?'ЗАВЕРШЕНА':'В ИГРЕ'}`;$('community').innerHTML=board.map(c=>card(c)).join('')+Array.from({length:5-board.length},()=>card(null,true)).join('');$('hole').innerHTML=players[user].hole.map(c=>card(c)).join('');$('seats').innerHTML=players.map((p,i)=>`<div class="seat s${i} ${i===actor&&!over?'active':''} ${p.folded?'folded':''} ${i===user?'user':''}"><div class="avatar">${p.icon}</div><div><div class="name">${p.name}${i===user?' · Вы':''}</div><div class="stack">${fmt(p.stack)} фишек</div><div class="state">${p.folded?'Фолд':p.allin?'All-in':i===actor&&!over?'Ход':p.action||'В игре'}</div></div></div>`).join('');$('betValue').textContent=$('betRange').value;$('fold').disabled=over||busy||actor!==user;$('checkCall').disabled=over||busy||actor!==user;$('raise').disabled=over||busy||actor!==user;$('allin').disabled=over||busy||actor!==user;$('checkCall').textContent=currentBet>players[user].bet?'Колл '+fmt(currentBet-players[user].bet):'Чек';$('raise').textContent=currentBet>players[user].bet?'Рейз':'Ставка'}
function post(i,n){let p=players[i],v=Math.min(n,p.stack);p.stack-=v;p.bet+=v;p.total+=v;pot+=v;if(!p.stack)p.allin=true}
function newHand(){if(players[user]&&players[user].stack<=0){logit('Стек пуст — нажми «Сбросить стек»');return}handNo++;shuffle();board=[];pot=0;currentBet=0;street=0;over=false;busy=false;log=[];players.forEach(p=>{p.hole=[deck.pop(),deck.pop()];p.folded=p.stack<=0;p.allin=false;p.bet=0;p.total=0;p.action='';});dealer=(dealer+1)%6;post((dealer+1)%6,sb);post((dealer+2)%6,bb);currentBet=bb;actor=next((dealer+2)%6);$('notice').classList.remove('show');logit('Новая раздача');render();if(actor!==user)aiLoop()}
function strength(p){let all=[...p.hole,...board],v=all.map(c=>ranks.indexOf(c.r)+2),counts={};v.forEach(x=>counts[x]=(counts[x]||0)+1);let c=Object.values(counts).sort((a,b)=>b-a),suitCount={};all.forEach(x=>suitCount[x.s]=(suitCount[x.s]||0)+1);let flush=Object.values(suitCount).some(x=>x>=5),u=[...new Set(v)].sort((a,b)=>b-a);if(u.includes(14))u.push(1);let straight=false;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4)straight=true;if(flush&&straight)return 8;if(c[0]===4)return 7;if(c[0]===3&&c[1]>=2)return 6;if(flush)return 5;if(straight)return 4;if(c[0]===3)return 3;if(c[0]===2&&c[1]===2)return 2;if(c[0]===2)return 1;let a=ranks.indexOf(p.hole[0].r),b=ranks.indexOf(p.hole[1].r);return (Math.max(a,b)>=10?.7:0)+(Math.abs(a-b)<=1?.3:0)+(p.hole[0].s===p.hole[1].s?.25:0)+(a===b?.7:0)}
function decide(p,i,call){let st=strength(p)+Math.random()*.35,style=p.style;if(style==='tight'&&st<1.3&&call>bb*2)return {t:'fold'};if(style==='careful'&&st<1.6&&call>bb*2)return {t:'fold'};if(style==='calling'&&Math.random()<.72)return {t:call?'call':'check'};if(style==='aggressive'&&st>.8&&Math.random()<.55)return {t:'raise',amt:Math.min(p.stack,Math.max(bb*2,currentBet+bb*2))};if(st>2.4&&Math.random()<.55)return {t:'raise',amt:Math.min(p.stack,Math.max(bb*2,currentBet+bb*2))};if(!call)return {t:'check'};if(st>.8&&Math.random()<.6)return {t:'call'};return {t:'fold'}}
function act(i,a){let p=players[i],call=Math.max(0,currentBet-p.bet);if(a.t==='fold'){p.folded=true;p.action='Фолд';logit(p.name+': фолд')}else if(a.t==='check'&&!call){p.action='Чек';logit(p.name+': чек')}else if(a.t==='call'){let v=Math.min(call,p.stack);p.stack-=v;p.bet+=v;p.total+=v;pot+=v;p.action=p.stack===0?'All-in':'Колл';if(!p.stack)p.allin=true;logit(p.name+': '+p.action)}else if(a.t==='raise'||a.t==='bet'){let target=Math.max(currentBet+bb,a.amt||bb*2),v=Math.min(Math.max(0,target-p.bet),p.stack);if(v){p.stack-=v;p.bet+=v;p.total+=v;pot+=v;currentBet=Math.max(currentBet,p.bet);p.action=a.t==='bet'?'Ставка':'Рейз';if(!p.stack)p.allin=true;logit(p.name+': '+p.action)}}else if(a.t==='allin'){let v=p.stack;p.stack=0;p.bet+=v;p.total+=v;pot+=v;p.allin=true;currentBet=Math.max(currentBet,p.bet);p.action='All-in';logit(p.name+': All-in')}}
function roundDone(){let a=active();return live().length<=1||a.length<=1||a.every(p=>p.bet===currentBet)}
function resetBets(){players.forEach(p=>p.bet=0);currentBet=0}
function advance(){if(live().length<=1){finish();return}if(street===0){board.push(deck.pop(),deck.pop(),deck.pop());street=1}else if(street===1){board.push(deck.pop());street=2}else if(street===2){board.push(deck.pop());street=3}else{finish();return}resetBets();actor=next(dealer);if(actor<0||active().length<=1){while(board.length<5)board.push(deck.pop());street=4;finish();return}logit('Открыты общие карты');render();if(actor!==user)aiLoop()}
function aiLoop(){if(over||busy)return;busy=true;render();setTimeout(()=>{if(over){busy=false;return}if(actor===user){busy=false;render();return}let p=players[actor];if(!p||p.folded||p.allin){actor=next(actor);busy=false;if(actor<0)advance();else aiLoop();return}act(actor,decide(p,actor,Math.max(0,currentBet-p.bet)));if(live().length<=1){busy=false;finish();return}if(roundDone()){busy=false;advance();return}actor=next(actor);busy=false;if(actor<0)advance();else{render();aiLoop()}},350+Math.random()*500)}
function val(c){return ranks.indexOf(c.r)+2}
function score5(cs){let vs=cs.map(val).sort((a,b)=>b-a),cnt={};vs.forEach(v=>cnt[v]=(cnt[v]||0)+1);let g=Object.entries(cnt).map(([v,n])=>({v:+v,n})).sort((a,b)=>b.n-a.n||b.v-a.v),flush=cs.every(c=>c.s===cs[0].s),u=[...new Set(vs)].sort((a,b)=>b-a);if(u.includes(14))u.push(1);let st=0;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4)st=Math.max(st,u[i]);if(flush&&st)return [8,st];if(g[0].n===4)return [7,g[0].v,...g.filter(x=>x.n===1).map(x=>x.v)];if(g[0].n===3&&g[1]?.n===2)return [6,g[0].v,g[1].v];if(flush)return [5,...vs];if(st)return [4,st];if(g[0].n===3)return [3,g[0].v,...g.filter(x=>x.n===1).map(x=>x.v).sort((a,b)=>b-a)];let pairs=g.filter(x=>x.n===2).map(x=>x.v).sort((a,b)=>b-a);if(pairs.length>=2)return [2,pairs[0],pairs[1],g.find(x=>x.n===1)?.v||0];if(pairs.length===1)return [1,pairs[0],...g.filter(x=>x.n===1).map(x=>x.v).sort((a,b)=>b-a)];return [0,...vs]}
function score(cards){let best=[-1];function comb(start,a){if(a.length===5){let s=score5(a);for(let i=0;i<Math.max(s.length,best.length);i++){let x=s[i]||0,y=best[i]||0;if(x>y){best=s;break}if(x<y)break}return}for(let i=start;i<cards.length;i++)comb(i+1,[...a,cards[i]])}comb(0,[]);return best}
function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){let x=a[i]||0,y=b[i]||0;if(x!==y)return x-y}return 0}
function finish(){if(over)return;over=true;busy=false;let surv=live(),winners=[];if(surv.length===1)winners=surv;else{street=4;let ranked=surv.map(p=>({p,s:score([...p.hole,...board])})).sort((a,b)=>cmp(b.s,a.s));winners=ranked.filter(x=>cmp(x.s,ranked[0].s)===0).map(x=>x.p)}let each=Math.floor(pot/winners.length),rem=pot%winners.length;winners.forEach((p,i)=>p.stack+=each+(i===0?rem:0));let userWon=winners.includes(players[user]);let cats=['старшая карта','пара','две пары','тройка','стрит','флеш','фулл-хаус','каре','стрит-флеш'];let cat=surv.length>1?cats[score([...winners[0].hole,...board])[0]]:'';$('notice').innerHTML=`<strong>${userWon?'Вы выиграли!':'Победитель: '+winners.map(p=>p.name).join(', ')}</strong>${cat}<div>Банк ${fmt(pot)} фишек</div><button id="nextHand">Следующая раздача</button>`;$('notice').classList.add('show');$('nextHand').onclick=newHand;$('message').textContent=userWon?'Победа!':`Победитель: ${winners.map(p=>p.name).join(', ')}`;render()}
function userAct(t){if(over||busy||actor!==user)return;let p=players[user],call=Math.max(0,currentBet-p.bet),a;if(t==='fold')a={t:'fold'};if(t==='call')a=call?{t:'call'}:{t:'check'};if(t==='raise'){let amount=Number($('betRange').value);a={t:call?'raise':'bet',amt:call?Math.max(currentBet+bb,amount):amount}}if(t==='allin')a={t:'allin'};act(user,a);if(live().length<=1){finish();return}if(roundDone()){advance();return}actor=next(user);if(actor<0){advance();return}render();aiLoop()}
function start(){players=[...bots.map(x=>({name:x[0],icon:x[1],style:x[2],stack:1000})),{name:'Вы',icon:'♠',style:'user',stack:1000}];$('fold').onclick=()=>userAct('fold');$('checkCall').onclick=()=>userAct('call');$('raise').onclick=()=>userAct('raise');$('allin').onclick=()=>userAct('allin');$('betRange').oninput=()=>$('betValue').textContent=$('betRange').value;$('newHand').onclick=()=>over?newHand():logit('Завершите текущую раздачу');$('reset').onclick=()=>{players.forEach(p=>p.stack=1000);newHand()};newHand()}
start();
})();
</script></body></html>
